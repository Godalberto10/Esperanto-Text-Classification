[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esperanto-nlp"
version = "0.2.0"
description = "Librería de NLP basada en reglas para Esperanto, con API similar a spaCy."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
dataset = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esperanto_nlp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
