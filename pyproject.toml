[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esperanto-nlp"
version = "0.2.0"
description = "Rule-based NLP library for Esperanto with a spaCy-like API."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
dataset = ["requests"]
notebook = [
    "beautifulsoup4", "jupyter", "matplotlib", "pandas", "requests",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esperanto_nlp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
